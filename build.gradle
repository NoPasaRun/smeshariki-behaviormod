plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "behaviormod"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"behaviormod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Декодер MP3 (JLayer, LGPL): саундтрек из файлов .mp3 играет сам мод, игра понимает только .ogg. Упаковывается в jar мода.
	implementation "com.googlecode.soundlibs:jlayer:1.0.1.4"
	include "com.googlecode.soundlibs:jlayer:1.0.1.4"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// SmesharikiMod: общий интерфейс окон (com.smeshariki.ui: Scroller, ListScreen, SelectScreen, палитра) и раздача модов; собранный jar лежит рядом, собирать его первым.
	implementation files("../SmesharikiMod/build/libs/smesharikimod-1.0.0.jar")
	// GameplayMod (персонажи, стропы, шар, мост механик): собранный jar лежит рядом. Пересобирайте его (./gradlew jar в GameplayMod) перед сборкой этого мода.
	implementation files("../GameplayMod/build/libs/gameplaymod-1.0.0.jar")
	// WorldMod (приглушение света на время кат-сцены, ViewLight): так же, собирать раньше этого мода.
	implementation files("../WorldMod/build/libs/worldmod-1.0.0.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
